<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./collect/style.css">
    <script src="./collect/motaik.js"></script>
    <title>图片模态框</title>
    <style>
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 关闭按钮 */
        .close {
            position: absolute;
            top: 10px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        /* 模态框内的图片 */
        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }
    </style>
</head>
<body>

    <!-- 原始图片 -->
    <img src="https://lh3.googleusercontent.com/d/1PCCnevuseugQX2pDCv4kEPnCwCZrqylH" 
         alt="播种期" class="clickable-img" onclick="openModal(this)">

    <!-- 模态框 -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        function openModal(img) {
            var modal = document.getElementById("imageModal");
            var modalImg = document.getElementById("modalImg");
            modal.style.display = "flex";  // 这里改成 flex 确保居中显示
            modalImg.src = img.src;
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }
    </script>

</body>
</html>
